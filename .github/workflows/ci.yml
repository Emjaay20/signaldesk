name: CI / Quality & E2E Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Migrate & Run E2E Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: signaldesk
          POSTGRES_PASSWORD: signaldesk
          POSTGRES_DB: signaldesk
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U signaldesk -d signaldesk"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      PORT: "3010"
      DATABASE_URL: postgresql://signaldesk:signaldesk@localhost:5434/signaldesk?schema=public
      ADMIN_TOKEN: ci-admin-token-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client & Deploy Migrations
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: TypeScript Strict Build Check
        run: npm run build

      - name: Execute Unit & E2E Test Suite
        run: npm test
