services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signaldesk
      POSTGRES_PASSWORD: signaldesk
      POSTGRES_DB: signaldesk
    ports:
      - "5434:5432"
    volumes:
      - signaldesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaldesk -d signaldesk"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  signaldesk_pgdata:
